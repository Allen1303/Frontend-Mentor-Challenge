<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icon-cart.svg"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Product preview card component</title>
  </head>
  <body>
    <main>
      <article class="product">
        <picture class="product-image">
          <source
            media="(min-width: 600px)"
            srcset="assets/image-product-desktop.jpg"
          />
          <img src="assets/image-product-mobile.jpg" alt="Product Image" />
        </picture>
        <div class="product-content">
          <p class="product-category">Perfume</p>
          <h1 class="product-title">Gabrielle Essence Eau De Parfume</h1>
          <p>
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="price-section">
            <p class="current-price">$149.99</p>
            <del class="product-original-price">$169.99</del>
          </div>
          <button class="add-to-cart-btn">
            <img src="assets/icon-cart.svg" alt="Add to Cart Icon" />
            Add to Cart
          </button>
        </div>
      </article>
    </main>

    <!-- <div class="attribution"> -->

    <!--     >Frontend Mentor</a -->
    <!--   >. Coded by <a href="#">Your Name Here</a>. -->
    <!-- </div> -->
  </body>
</html>
